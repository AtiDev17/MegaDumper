name: Build and Upload MegaDumper

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore MegaDumper.sln

    - name: Build x64
      run: dotnet build MegaDumper.sln -c Release -p:Platform=x64 --no-restore

    - name: Build x86
      run: dotnet build MegaDumper.sln -c Release -p:Platform=x86 --no-restore

    - name: Upload MegaDumper Binaries
      uses: actions/upload-artifact@v4
      with:
        name: MegaDumper-Full-Release
        path: |
          **/bin/x64/Release/net8.0-windows/
          **/bin/x86/Release/net8.0-windows/
        include-hidden-files: true
